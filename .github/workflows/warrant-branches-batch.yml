name: warrant-branches-batch
on:
  workflow_call:
    inputs:
      check_gate:
        type: boolean
        default: false
      budget_seconds:
        type: number
        default: 900
      continuation:
        type: boolean
        default: false
    outputs:
      resume:
        description: 'A productive batch has unattempted budget or backlog items'
        value: ${{ jobs.update.outputs.resume }}
permissions:
  actions: read
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      resume: ${{ steps.collect.outputs.resume }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip recently completed duplicate checks
        id: gate
        if: inputs.check_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/derivatives/schedule_health.py --gate warrant-branches-daily.yml --minutes 90
      - name: Fetch bounded warrant rankings
        id: collect
        if: ${{ !inputs.check_gate || steps.gate.outputs.run == 'true' }}
        continue-on-error: true
        env:
          BUDGET_SECONDS: ${{ inputs.budget_seconds }}
          CONTINUATION: ${{ inputs.continuation }}
        run: |
          args=(--allow-budget-continuation --budget-seconds "$BUDGET_SECONDS")
          if [ "$CONTINUATION" = true ]; then
            args+=(--continue-budget-batch)
          fi
          python automation/derivatives/warrant_branches.py "${args[@]}"
      # Save each batch before another runner reads its remaining/completed records.
      - name: Update individual-stock ranking coverage
        id: coverage
        if: steps.collect.outcome == 'success' || steps.collect.outcome == 'failure'
        continue-on-error: true
        run: |
          if [ -f data/derivatives/stock-warrant-directory.json ]; then
            python automation/derivatives/warrant_directory.py --coverage-only
          fi
      - name: Refresh daily warrant research journal with ranking evidence
        id: journal
        if: steps.collect.outcome == 'success' || steps.collect.outcome == 'failure'
        continue-on-error: true
        run: python automation/derivatives/warrant_journal.py
      - name: Update monthly spot and warrant relationships
        id: relationship
        if: steps.collect.outcome == 'success' || steps.collect.outcome == 'failure'
        continue-on-error: true
        run: python automation/derivatives/warrant_relationship.py
      - name: Update broker signal event study
        id: signal_backtest
        if: steps.collect.outcome == 'success' || steps.collect.outcome == 'failure'
        continue-on-error: true
        run: python automation/derivatives/warrant_signal_backtest.py
      - name: Record actual ranking check
        if: steps.collect.outcome == 'success' || steps.collect.outcome == 'failure'
        run: python automation/derivatives/check_status.py branches ${{ steps.collect.outcome }} ${{ steps.coverage.outcome }} ${{ steps.journal.outcome }} ${{ steps.relationship.outcome }} ${{ steps.signal_backtest.outcome }}
      - name: Commit rankings and source status
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/derivatives/warrant-branches*
          if [ -d data/derivatives/warrant-signal-backtest ]; then git add data/derivatives/warrant-signal-backtest/; fi
          if [ -d data/derivatives/warrant-relationship ]; then git add data/derivatives/warrant-relationship/; fi
          if [ -d data/derivatives/daily-reports/warrant-journal ]; then git add data/derivatives/daily-reports/warrant-journal/; fi
          if [ -f data/derivatives/check-branches.json ]; then git add data/derivatives/check-branches.json; fi
          if [ -f data/derivatives/stock-warrant-coverage.json ]; then git add data/derivatives/stock-warrant-coverage.json; fi
          if [ -f data/derivatives/trading-calendar.json ]; then
            git add data/derivatives/trading-calendar.json
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Checked at $(date -u +%FT%TZ): no ranking data changed; checking deployment recovery." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m 'data: daily warrant broker rankings'
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "Ranking data changed at $(date -u +%FT%TZ):"; echo '```'; git show --shortstat --format='%h %s' HEAD; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Ensure GitHub Pages is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/derivatives/ensure_pages.py
      - name: Report unavailable sources
        if: steps.collect.outcome == 'failure' || steps.coverage.outcome == 'failure' || steps.journal.outcome == 'failure' || steps.relationship.outcome == 'failure' || steps.signal_backtest.outcome == 'failure'
        run: exit 1
