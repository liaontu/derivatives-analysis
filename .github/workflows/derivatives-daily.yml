name: derivatives-daily
on:
  schedule:
    # Taipei mornings after US close (both DST seasons), evenings after Taiwan close.
    - cron: '23 0,3,8,10,12,14 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  pages: write
  deployments: read
concurrency:
  group: derivatives-daily
  cancel-in-progress: false
  queue: max
jobs:
  update:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Re-runs must accumulate from the latest history, not the original run SHA.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip recently completed duplicate checks
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/derivatives/schedule_health.py --gate derivatives-daily.yml --minutes 30
      - name: Fill recent missing TPEx warrant history days
        id: tpex_history
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/tpex_history.py --max-days 2
      - name: Fetch official derivatives data
        id: collect
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/collect.py
      - name: Refresh individual-stock warrant issuance directory
        id: directory
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/warrant_directory.py
      - name: Archive option history and recompute daily changes and event tests
        id: option_history
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/option_history.py --max-windows 2
      - name: Match Taiwan individual-stock options to same-day spot prices
        id: stock_options
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/stock_options.py
      - name: Preserve full derivatives history and repair bounded gaps
        id: market_history
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/market_history.py --max-windows 6
      - name: Archive warrant volume and futures/options positioning reports
        id: reports
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/daily_reports.py
      - name: Build daily warrant research journal
        id: journal
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/warrant_journal.py
      - name: Match official stock institutional flows with warrant observations
        id: stock_institutional
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/stock_institutional.py
      - name: Repair recent institutional history gaps within free source limits
        id: institutional_history
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/institutional_history.py --max-days 2
      - name: Update institutional trends and dated stock warrant event study
        id: institutional_research
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/institutional_research.py
      - name: Update monthly spot and warrant relationships
        id: relationship
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/warrant_relationship.py
      - name: Archive daily warrant and stock brief
        id: report_brief
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/warrant_series_reports.py --kind daily
      - name: Update broker signal event study
        id: signal_backtest
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/warrant_signal_backtest.py
      - name: Build futures and options daily brief
        id: derivative_daily
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python automation/derivatives/derivative_reports.py --kind daily
      - name: Record actual market check
        if: steps.collect.outcome == 'success' || steps.collect.outcome == 'failure'
        run: python automation/derivatives/check_status.py market market_history=${{ steps.market_history.outcome }} derivative_daily=${{ steps.derivative_daily.outcome }} collect=${{ steps.collect.outcome }} directory=${{ steps.directory.outcome }} option_history=${{ steps.option_history.outcome }} stock_options=${{ steps.stock_options.outcome }} reports=${{ steps.reports.outcome }} journal=${{ steps.journal.outcome }} relationship=${{ steps.relationship.outcome }} signal_backtest=${{ steps.signal_backtest.outcome }} report_brief=${{ steps.report_brief.outcome }} tpex_history=${{ steps.tpex_history.outcome }} stock_institutional=${{ steps.stock_institutional.outcome }} institutional_history=${{ steps.institutional_history.outcome }} institutional_research=${{ steps.institutional_research.outcome }}
      - name: Measure data storage without rewriting history
        if: steps.gate.outputs.run == 'true'
        run: python automation/derivatives/storage_health.py
      - name: Commit data and source status
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/derivatives/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Checked at $(date -u +%FT%TZ): no published data changed; checking deployment recovery." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m 'data: daily official derivatives update'
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "Published data changed at $(date -u +%FT%TZ):"; echo '```'; git show --shortstat --format='%h %s' HEAD; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # A no-op collection still repairs a previously failed deployment.
      - name: Ensure GitHub Pages is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/derivatives/ensure_pages.py
      - name: Report unavailable sources
        if: steps.market_history.outcome == 'failure' || steps.derivative_daily.outcome == 'failure' || steps.collect.outcome == 'failure' || steps.directory.outcome == 'failure' || steps.option_history.outcome == 'failure' || steps.stock_options.outcome == 'failure' || steps.reports.outcome == 'failure' || steps.journal.outcome == 'failure' || steps.relationship.outcome == 'failure' || steps.signal_backtest.outcome == 'failure' || steps.report_brief.outcome == 'failure' || steps.tpex_history.outcome == 'failure' || steps.stock_institutional.outcome == 'failure' || steps.institutional_history.outcome == 'failure' || steps.institutional_research.outcome == 'failure'
        run: exit 1
