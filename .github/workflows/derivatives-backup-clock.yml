name: derivatives-backup-clock
on:
  schedule:
    - cron: '47 5,15 * * *'
    # Taipei 16:30 / 18:30 / 20:30: bounded recovery after local close.
    - cron: '30 8,10,12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only inspect recovery decisions; do not dispatch collectors'
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: derivatives-backup-clock
  cancel-in-progress: false
jobs:
  check:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dispatch only missing collection windows
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_DRY_RUN: ${{ inputs.dry_run || false }}
        run: python automation/derivatives/cloud_recovery.py
