name: warrant-branches-daily
on:
  schedule:
    - cron: '13 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: derivatives-daily
  cancel-in-progress: false
jobs:
  update:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch bounded warrant rankings
        id: collect
        continue-on-error: true
        run: python automation/derivatives/warrant_branches.py
      - name: Commit rankings and source status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/derivatives/warrant-branches*
          if ! git diff --cached --quiet; then
            git commit -m 'data: daily warrant broker rankings'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Report unavailable sources
        if: steps.collect.outcome == 'failure'
        run: exit 1
