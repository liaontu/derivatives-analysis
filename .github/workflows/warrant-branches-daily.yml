name: warrant-branches-daily
on:
  schedule:
    - cron: '13 12,14,15 * * *'
  workflow_dispatch:
    inputs:
      initial_budget_seconds:
        description: 'First batch budget (60–900 seconds; shorter values exercise automatic continuation)'
        type: number
        default: 900
permissions:
  actions: read
  contents: write
  pages: write
concurrency:
  group: derivatives-daily
  cancel-in-progress: false
  queue: max
jobs:
  update:
    if: github.event.repository.private == false
    uses: ./.github/workflows/warrant-branches-batch.yml
    with:
      check_gate: true
      budget_seconds: ${{ fromJSON(format('{0}', inputs.initial_budget_seconds || 900)) }}
  continue_1:
    needs: update
    if: needs.update.outputs.resume == 'true'
    uses: ./.github/workflows/warrant-branches-batch.yml
    with:
      continuation: true
  continue_2:
    needs: continue_1
    if: needs.continue_1.outputs.resume == 'true'
    uses: ./.github/workflows/warrant-branches-batch.yml
    with:
      continuation: true
  report_budget_limit:
    needs: continue_2
    if: needs.continue_2.outputs.resume == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report bounded continuation limit
        run: |
          echo 'Three productive batches completed but rankings remain pending. Progress is saved; the next scheduled run will resume.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
