name: derivatives-series-reports
on:
  schedule:
    # Saturday 12:00 Taipei: Friday's Taiwan data arrives in the evening runs of derivatives-daily;
    # the weekly report runs every Saturday and the monthly one on the first Saturday of the month.
    - cron: '0 4 * * 6'
  workflow_dispatch:
    inputs:
      kind:
        description: 'auto (weekly, plus monthly on the 1st-7th), weekly, monthly or both'
        default: 'auto'
      today:
        description: 'Run as if on this Taipei date (YYYY-MM-DD); blank = today'
        default: ''
permissions:
  contents: write
concurrency:
  group: derivatives-series-reports
  cancel-in-progress: false
jobs:
  reports:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build weekly and monthly warrant series reports
        env:
          KIND: ${{ inputs.kind || 'auto' }}
          TODAY: ${{ inputs.today }}
        run: python automation/derivatives/warrant_series_reports.py --kind "$KIND" ${TODAY:+--today "$TODAY"}
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/derivatives/warrant-series-reports data/derivatives/warrant-series-reports.json
          if git diff --cached --quiet; then
            echo "Checked at $(date -u +%FT%TZ): reports unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m 'data: weekly and monthly warrant series reports'
            git pull --rebase origin main
            git push origin HEAD:main
            { echo "Published reports at $(date -u +%FT%TZ):"; echo '```'; git show --shortstat --format='%h %s' HEAD; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
