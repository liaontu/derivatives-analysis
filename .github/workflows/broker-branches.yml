name: broker-branches
on:
  schedule:
    - cron: '43 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: broker-branches
  cancel-in-progress: false
jobs:
  update:
    # Public standard runner is free; never run this job in a private repository.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and encrypt personal rankings
        id: collect
        continue-on-error: true
        run: node automation/branches/run.mjs
      - name: Save encrypted snapshots and update status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/branches/
          if ! git diff --cached --quiet; then
            git commit -m 'data: encrypted daily branch rankings'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report source failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
